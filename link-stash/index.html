<title>Link Stash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column — dump box, a "what you forgot" strip, filters, then the pile. Built for a phone at the end of the day. */
:root {
  --bg: #f3f4f7;
  --surface: #ffffff;
  --sunk: #e8eaf0;
  --ink: #161a2c;
  --muted: #5d6378;
  --line: #d9dce5;
  --accent: #2f45d8;
  --accent-ink: #ffffff;
  --gold: #f4c534;
  --gold-soft: #fff3c4;
  --job: #12805c;   --job-bg: #dff3ea;
  --learn: #2f45d8; --learn-bg: #e2e6ff;
  --post: #b4306f;  --post-bg: #fbe2ee;
  --other: #5d6378; --other-bg: #e8eaf0;
  --danger: #c2362b;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f121b; --surface: #171b27; --sunk: #1f2433; --ink: #e9ebf3; --muted: #9aa0b6; --line: #2a3043;
  --accent: #8a9bff; --accent-ink: #0f121b; --gold: #f4c534; --gold-soft: #3a3214;
  --job: #5fd3a6; --job-bg: #143027; --learn: #8a9bff; --learn-bg: #1d2448;
  --post: #f08cbb; --post-bg: #3a1a2a; --other: #9aa0b6; --other-bg: #23283a; --danger: #ff7b70;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0f121b; --surface: #171b27; --sunk: #1f2433; --ink: #e9ebf3; --muted: #9aa0b6; --line: #2a3043;
  --accent: #8a9bff; --accent-ink: #0f121b; --gold: #f4c534; --gold-soft: #3a3214;
  --job: #5fd3a6; --job-bg: #143027; --learn: #8a9bff; --learn-bg: #1d2448;
  --post: #f08cbb; --post-bg: #3a1a2a; --other: #9aa0b6; --other-bg: #23283a; --danger: #ff7b70;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 96px;
}
.wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 7vw, 42px); letter-spacing: -0.02em; line-height: 1; margin: 0; }
h1 mark { background: linear-gradient(transparent 55%, var(--gold) 55%); color: inherit; padding: 0 2px; }
.sub { color: var(--muted); font-size: 13px; margin: 0; }

/* Dump box */
.dump { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.dump textarea { width: 100%; min-height: 76px; resize: vertical; border: 0; background: transparent; outline: none; font-size: 16px; line-height: 1.45; }
.dump textarea::placeholder { color: var(--muted); }
.dump-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dump-row .hint { color: var(--muted); font-size: 12px; flex: 1 1 180px; min-width: 0; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn.gold { background: var(--gold); color: #161a2c; border-color: var(--gold); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }

/* Summary strip */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 560px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--f-display); font-size: 26px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.stat.warn { background: var(--gold-soft); border-color: var(--gold); }
.stat[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: -1px; }

.nudge { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: space-between; padding: 12px 14px; border-radius: 12px; background: var(--gold-soft); border: 1px dashed var(--gold); }
.nudge p { margin: 0; flex: 1 1 220px; min-width: 0; }

/* Filters */
.filters { display: flex; flex-direction: column; gap: 10px; }
.filters .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.search { flex: 1 1 200px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; font-size: 15px; }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tabs button { border: 0; background: none; padding: 6px 10px; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); font-weight: 600; }
.tabs .n { font-family: var(--f-mono); font-size: 12px; margin-left: 4px; opacity: .7; }

/* List */
.list { display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 4px 12px; }
.item.done { opacity: .62; }
.item.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 3px var(--gold); } to { box-shadow: 0 0 0 0 transparent; } }
.mono-badge { width: 36px; height: 36px; border-radius: 9px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 15px; grid-row: span 3; }
.item .title { font-weight: 600; font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; color: var(--ink); text-decoration: none; }
.item a.title:hover { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 2px; }
.item .meta { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); }
.item .domain { font-family: var(--f-mono); overflow-wrap: anywhere; }
.item .note { font-size: 14px; color: var(--muted); margin: 2px 0 0; overflow-wrap: anywhere; white-space: pre-wrap; }
.chip { display: inline-block; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.t-job { color: var(--job); background: var(--job-bg); }
.t-learn { color: var(--learn); background: var(--learn-bg); }
.t-post { color: var(--post); background: var(--post-bg); }
.t-other { color: var(--other); background: var(--other-bg); }
.due { font-family: var(--f-mono); }
.due.soon { color: var(--danger); font-weight: 600; }
.stale { color: #8a6500; background: var(--gold-soft); border-radius: 4px; padding: 0 5px; }
:root[data-theme="dark"] .stale { color: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stale { color: var(--gold); } }
.actions { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.actions .btn { padding: 4px 10px; font-size: 13px; border-radius: 8px; }
.actions .star[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: #161a2c; }
.actions .del { color: var(--danger); }
.edit { grid-column: 1 / -1; display: grid; gap: 8px; margin-top: 8px; }
.edit label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.edit input, .edit textarea, .edit select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 10px; font-size: 15px; color: var(--ink); width: 100%; min-width: 0; }
.edit .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.empty { text-align: center; padding: 36px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; }
.empty h2 { font-family: var(--f-display); color: var(--ink); font-size: 20px; margin: 0 0 6px; }
.empty p { margin: 0 auto; max-width: 44ch; }

/* Triage */
.triage { position: fixed; inset: 0; background: rgb(10 12 20 / .55); display: grid; place-items: center; z-index: 30;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.triage-card { background: var(--surface); border-radius: 16px; padding: 20px; width: min(520px, 100%); display: flex; flex-direction: column; gap: 12px; }
.triage-card .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.triage-card h2 { font-family: var(--f-display); font-size: 22px; margin: 0; overflow-wrap: anywhere; line-height: 1.2; }
.triage-card .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.triage-card .grid .btn { padding: 10px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: 14px; z-index: 40; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { .item.flash { animation: none; } }
</style>

<div class="wrap">
  <header>
    <h1>Link <mark>Stash</mark></h1>
    <p class="sub" id="sub">Everything you meant to come back to.</p>
  </header>

  <section class="dump" aria-label="Add links">
    <textarea id="dump" placeholder="Paste a link, a few links, or a whole WhatsApp message. Add a note if you like.&#10;Tip: you can also paste anywhere on this page."></textarea>
    <div class="dump-row">
      <div class="seg" id="typeSeg" role="group" aria-label="Type">
        <button type="button" data-t="auto" aria-pressed="true">Auto</button>
        <button type="button" data-t="job" aria-pressed="false">Job</button>
        <button type="button" data-t="learn" aria-pressed="false">Learning</button>
        <button type="button" data-t="post" aria-pressed="false">Post</button>
        <button type="button" data-t="other" aria-pressed="false">Other</button>
      </div>
      <span class="hint" id="dumpHint">Ctrl/⌘ + Enter to save</span>
      <button class="btn primary" id="saveBtn" type="button">Stash it</button>
    </div>
  </section>

  <div class="strip" id="strip">
    <button class="stat" data-f="inbox" type="button"><b id="sInbox">–</b><span>Not looked at</span></button>
    <button class="stat" data-f="stale" type="button"><b id="sStale">–</b><span>Forgotten 3+ days</span></button>
    <button class="stat" data-f="jobs" type="button"><b id="sJobs">–</b><span>Jobs to apply</span></button>
    <button class="stat" data-f="due" type="button"><b id="sDue">–</b><span>Due in 7 days</span></button>
  </div>

  <div class="nudge" id="nudge" hidden>
    <p id="nudgeText"></p>
    <button class="btn gold" id="triageBtn" type="button">Review now</button>
  </div>

  <section class="filters" aria-label="Filter">
    <div class="tabs" id="tabs" role="group" aria-label="Status">
      <button type="button" data-s="inbox" aria-pressed="true">Inbox<span class="n"></span></button>
      <button type="button" data-s="later" aria-pressed="false">Queued<span class="n"></span></button>
      <button type="button" data-s="done" aria-pressed="false">Done<span class="n"></span></button>
      <button type="button" data-s="starred" aria-pressed="false">Starred<span class="n"></span></button>
      <button type="button" data-s="all" aria-pressed="false">All<span class="n"></span></button>
    </div>
    <div class="row">
      <input class="search" id="q" type="search" placeholder="Search titles, notes, sites…" aria-label="Search">
      <div class="seg" id="kindSeg" role="group" aria-label="Kind">
        <button type="button" data-k="all" aria-pressed="true">All</button>
        <button type="button" data-k="job" aria-pressed="false">Jobs</button>
        <button type="button" data-k="learn" aria-pressed="false">Learning</button>
        <button type="button" data-k="post" aria-pressed="false">Posts</button>
        <button type="button" data-k="other" aria-pressed="false">Other</button>
      </div>
    </div>
  </section>

  <section class="list" id="list" aria-live="polite">
    <div class="empty"><h2>Opening your stash…</h2><p>Your saved links will show up here. Paste one above to add the first.</p></div>
  </section>
</div>

<div class="triage" id="triage" hidden>
  <div class="triage-card" role="dialog" aria-modal="true" aria-labelledby="trTitle">
    <span class="count" id="trCount"></span>
    <h2 id="trTitle"></h2>
    <div class="meta" id="trMeta" style="display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)"></div>
    <p id="trNote" style="margin:0;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere"></p>
    <a class="btn primary" id="trOpen" href="#" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">Open link</a>
    <div class="grid">
      <button class="btn" id="trLater" type="button">Queue for later</button>
      <button class="btn" id="trDone" type="button">Done</button>
      <button class="btn" id="trSkip" type="button">Skip</button>
      <button class="btn del" id="trDel" type="button" style="color:var(--danger)">Delete</button>
    </div>
    <button class="btn" id="trClose" type="button">Close review</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const DAY = 86400000;
  const TYPE_LABEL = { job: "Job", learn: "Learning", post: "Post", other: "Other" };
  const STATUS_NEXT_LABEL = (it) => it.type === "job" ? "Applied" : "Done";

  let db = null, links = [], ready = false;
  let view = { status: "inbox", kind: "all", q: "", focus: null };
  let addType = "auto";
  let editingId = null, draft = null, pendingRender = false, confirmDel = null;
  let triageQueue = [], triageIdx = 0;

  // ---------- URL understanding ----------
  const URL_RE = /\bhttps?:\/\/[^\s<>"'`]+|\bwww\.[^\s<>"'`]+/gi;
  const cleanUrl = (u) => {
    u = u.replace(/[)\].,;!?*_]+$/, "");
    if (!/^https?:/i.test(u)) u = "https://" + u;
    try {
      const x = new URL(u);
      ["utm_source","utm_medium","utm_campaign","utm_term","utm_content","igsh","igshid","si","fbclid","trk","trackingId","refId"].forEach(p => x.searchParams.delete(p));
      return x.toString();
    } catch { return u; }
  };
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\.|^m\./, ""); } catch { return ""; } };

  const SOURCES = [
    [/linkedin\.com|lnkd\.in/, "LinkedIn", "in"], [/instagram\.com|instagr\.am/, "Instagram", "Ig"],
    [/youtube\.com|youtu\.be/, "YouTube", "Yt"], [/(^|\.)x\.com|twitter\.com/, "X", "X"],
    [/whatsapp\.com|wa\.me/, "WhatsApp", "Wa"], [/github\.com/, "GitHub", "Gh"],
    [/medium\.com/, "Medium", "M"], [/naukri\.com/, "Naukri", "N"], [/indeed\./, "Indeed", "Id"],
    [/glassdoor\./, "Glassdoor", "Gd"], [/internshala\.com/, "Internshala", "Is"], [/wellfound\.com|angel\.co/, "Wellfound", "Wf"],
    [/coursera\.org/, "Coursera", "C"], [/udemy\.com/, "Udemy", "U"], [/geeksforgeeks\.org/, "GfG", "G"],
    [/leetcode\.com/, "LeetCode", "Lc"], [/kaggle\.com/, "Kaggle", "K"], [/reddit\.com/, "Reddit", "R"],
    [/docs\.google\.com|forms\.gle/, "Google", "G"], [/notion\.(so|site)/, "Notion", "No"],
  ];
  const sourceOf = (u) => {
    const h = host(u);
    for (const [re, name, mono] of SOURCES) if (re.test(h)) return { name, mono };
    const base = h.split(".").slice(-2, -1)[0] || "note";
    return { name: h || "Note", mono: base.slice(0, 2).replace(/^./, c => c.toUpperCase()) };
  };

  const JOB_HOST = /naukri|indeed|glassdoor|internshala|wellfound|angel\.co|lever\.co|greenhouse\.io|workday|myworkdayjobs|smartrecruiters|ashbyhq|instahyre|hirist|cutshort|foundit|unstop|careers?\./;
  const LEARN_HOST = /coursera|udemy|edx|freecodecamp|geeksforgeeks|leetcode|kaggle|w3schools|khanacademy|arxiv|towardsdatascience|youtube|youtu\.be|docs\.|developer\.|readthedocs|roadmap\.sh|nptel|swayam|medium\.com|dev\.to|hashnode/;
  const JOB_WORDS = /\b(hiring|job|jobs|apply|applying|vacanc|opening|openings|internship|intern|career|careers|recruit|referral|walk-?in|fresher|ctc|lpa)\b/i;
  const LEARN_WORDS = /\b(course|tutorial|learn|learning|roadmap|guide|docs|documentation|playlist|lecture|cheat ?sheet|notes|interview prep|dsa|bootcamp|free resource)\b/i;
  const guessType = (u, text) => {
    const h = host(u), path = (() => { try { return new URL(u).pathname; } catch { return ""; } })();
    if (/linkedin\.com/.test(h) && /\/jobs?\//.test(path)) return "job";
    if (JOB_HOST.test(h) || /\/(jobs?|careers?|apply)\b/.test(path) || JOB_WORDS.test(text)) return "job";
    if (/instagram\.com|(^|\.)x\.com|twitter\.com|reddit\.com/.test(h) || (/linkedin\.com/.test(h) && /\/(posts|feed|pulse)\//.test(path))) {
      return LEARN_WORDS.test(text) ? "learn" : "post";
    }
    if (LEARN_HOST.test(h) || LEARN_WORDS.test(text)) return "learn";
    return u ? "other" : "post";
  };
  const titleFromUrl = (u) => {
    try {
      const x = new URL(u);
      const segs = x.pathname.split("/").filter(Boolean).filter(s => !/^[\w-]{0,3}$/.test(s) || s.length > 3);
      let s = decodeURIComponent(segs.reverse().find(s => /[a-z]{3}/i.test(s) && !/^(p|reel|reels|posts|view|watch|shorts|status|jobs|in|feed|update|urn:li.*)$/i.test(s)) || "");
      s = s.replace(/\.(html?|php|aspx?)$/i, "").replace(/[-_+]+/g, " ").replace(/\b(activity|ugcPost)\s*\d+.*$/i, "").replace(/\s\d{6,}.*$/, "").trim();
      const src = sourceOf(u).name;
      if (s.length > 3) return s.charAt(0).toUpperCase() + s.slice(1);
      if (/shorts/.test(x.pathname)) return src + " short";
      if (/reel/.test(x.pathname)) return src + " reel";
      if (/\/p\/|posts|feed/.test(x.pathname)) return src + " post";
      if (/watch/.test(x.pathname)) return src + " video";
      return src + " link";
    } catch { return "Link"; }
  };
  // Strip WhatsApp export prefixes like "[30/10/26, 9:14 PM] Name: " or "30/10/2026, 21:14 - Name: "
  const stripChatPrefix = (line) => line
    .replace(/^\s*\[?\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4},?\s+\d{1,2}:\d{2}(?::\d{2})?\s*(?:[ap]\.?m\.?)?\]?\s*(?:-\s*)?[^:]{1,40}:\s*/i, "")
    .trim();

  function parseDump(raw, forcedType) {
    const lines = raw.split(/\r?\n/);
    const out = [];
    const looseText = [];
    for (const line of lines) {
      const urls = line.match(URL_RE);
      if (!urls) { const t = stripChatPrefix(line); if (t) looseText.push(t); continue; }
      const textOnLine = stripChatPrefix(line.replace(URL_RE, " ")).replace(/\s+/g, " ").trim();
      for (const u0 of urls) out.push({ url: cleanUrl(u0), lineText: textOnLine });
    }
    const extra = looseText.join("\n").trim();
    if (!out.length) {
      if (!extra) return [];
      const first = extra.split("\n")[0];
      return [{ url: "", title: first.slice(0, 120), note: extra.length > first.length ? extra : "", type: forcedType || guessType("", extra) }];
    }
    return out.map(({ url, lineText }) => {
      const note = [lineText, out.length === 1 ? extra : ""].filter(Boolean).join("\n").trim();
      const title = lineText && lineText.length <= 90 ? lineText : titleFromUrl(url);
      return { url, title, note: note === title ? "" : note, type: forcedType || guessType(url, note) };
    });
  }

  // ---------- helpers ----------
  const ago = (t) => {
    const d = Date.now() - t;
    if (d < 3600000) return Math.max(1, Math.round(d / 60000)) + "m ago";
    if (d < DAY) return Math.round(d / 3600000) + "h ago";
    const n = Math.round(d / DAY); return n === 1 ? "yesterday" : n + "d ago";
  };
  const daysUntil = (iso) => { if (!iso) return null; const d = new Date(iso + "T23:59:59"); return Math.ceil((d - Date.now()) / DAY); };
  const isStale = (it) => it.status === "inbox" && Date.now() - it.createdAt > 3 * DAY;
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
    return n;
  };
  let toastTimer;
  const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); };

  // ---------- data ----------
  async function addItems(items) {
    if (!db) { toast("Your stash isn't connected. Open this page signed in to claude.ai."); return false; }
    let added = 0, dupes = 0, lastId = null;
    for (const it of items) {
      const existing = it.url && links.find(l => l.url === it.url);
      if (existing) { dupes++; lastId = existing.id; continue; }
      const now = Date.now();
      const src = it.url ? sourceOf(it.url).name : "Note";
      try {
        const ref = await db.collection("links").add({
          url: it.url, title: it.title || titleFromUrl(it.url), note: it.note || "", type: it.type,
          source: src, status: "inbox", starred: false, due: "", createdAt: now, updatedAt: now,
        });
        added++; lastId = ref.id;
      } catch (e) {
        toast(e && e.code === "quota_exceeded" ? "Your stash is full. Delete some done items first." : "Couldn't save. Check your connection and try again.");
        return false;
      }
    }
    view.focus = lastId;
    if (added && view.status !== "inbox" && view.status !== "all") setStatusTab("inbox");
    toast(added ? `Stashed ${added} ${added === 1 ? "item" : "items"}` + (dupes ? ` · ${dupes} already saved` : "") : "Already in your stash");
    return true;
  }
  const patch = async (id, data) => {
    try { await db.doc("links/" + id).update({ ...data, updatedAt: Date.now() }); }
    catch { toast("Couldn't update. Try again."); }
  };
  const remove = async (id) => { try { await db.doc("links/" + id).delete(); toast("Deleted"); } catch { toast("Couldn't delete. Try again."); } };

  // ---------- render ----------
  function filtered() {
    const q = view.q.trim().toLowerCase();
    return links.filter(it => {
      if (view.status === "starred" ? !it.starred : view.status === "stale" ? !isStale(it)
        : view.status === "jobs" ? !(it.type === "job" && it.status !== "done")
        : view.status === "due" ? !(it.due && it.status !== "done" && daysUntil(it.due) <= 7)
        : view.status !== "all" && it.status !== view.status) return false;
      if (view.kind !== "all" && it.type !== view.kind) return false;
      if (q && !(`${it.title} ${it.note} ${it.url} ${it.source}`.toLowerCase().includes(q))) return false;
      return true;
    }).sort((a, b) => {
      if (view.status === "due") return (a.due || "").localeCompare(b.due || "");
      return b.createdAt - a.createdAt;
    });
  }

  function renderStats() {
    const inbox = links.filter(l => l.status === "inbox");
    const stale = links.filter(isStale);
    const jobs = links.filter(l => l.type === "job" && l.status !== "done");
    const due = links.filter(l => l.due && l.status !== "done" && daysUntil(l.due) <= 7);
    $("sInbox").textContent = inbox.length; $("sStale").textContent = stale.length;
    $("sJobs").textContent = jobs.length; $("sDue").textContent = due.length;
    document.querySelector('.stat[data-f="stale"]').classList.toggle("warn", stale.length > 0);
    document.querySelectorAll(".stat").forEach(b => b.setAttribute("aria-pressed", String(view.status === b.dataset.f)));
    const counts = { inbox: inbox.length, later: links.filter(l => l.status === "later").length, done: links.filter(l => l.status === "done").length, starred: links.filter(l => l.starred).length, all: links.length };
    document.querySelectorAll("#tabs button").forEach(b => { b.querySelector(".n").textContent = counts[b.dataset.s] ?? ""; });
    const today = links.filter(l => Date.now() - l.createdAt < DAY).length;
    $("sub").textContent = links.length ? `${links.length} saved · ${today} today` : "Everything you meant to come back to.";
    if (inbox.length) {
      $("nudge").hidden = false;
      $("nudgeText").textContent = stale.length
        ? `${stale.length} ${stale.length === 1 ? "thing has" : "things have"} sat untouched for 3+ days. Take two minutes and sort ${stale.length === 1 ? "it" : "them"}.`
        : `${inbox.length} new ${inbox.length === 1 ? "thing" : "things"} in your inbox. Quick review before you sleep?`;
    } else $("nudge").hidden = true;
  }

  function badgeStyle(type) { return `background:var(--${type === "learn" ? "learn" : type}-bg);color:var(--${type})`; }

  function renderItem(it) {
    const src = it.url ? sourceOf(it.url) : { name: "Note", mono: "✎" };
    const dU = daysUntil(it.due);
    const isEditing = editingId === it.id;
    const titleNode = it.url
      ? el("a", { class: "title", href: it.url, target: "_blank", rel: "noopener", text: it.title || it.url })
      : el("span", { class: "title", text: it.title || "(untitled note)" });
    const meta = el("div", { class: "meta" },
      el("span", { class: "chip t-" + it.type, text: TYPE_LABEL[it.type] || "Other" }),
      it.url ? el("span", { class: "domain", text: host(it.url) }) : null,
      el("span", { text: ago(it.createdAt) }),
      isStale(it) ? el("span", { class: "stale", text: "forgotten" }) : null,
      it.due ? el("span", { class: "due" + (it.status !== "done" && dU <= 3 ? " soon" : ""), text: "due " + it.due + (it.status !== "done" ? (dU < 0 ? " · overdue" : dU === 0 ? " · today" : ` · ${dU}d`) : "") }) : null,
      it.status === "done" ? el("span", { text: it.type === "job" ? "✓ applied" : "✓ done" }) : null,
    );
    const actions = el("div", { class: "actions" },
      it.status !== "later" && it.status !== "done" ? el("button", { class: "btn", type: "button", text: "Queue", onclick: () => patch(it.id, { status: "later" }) }) : null,
      it.status !== "done" ? el("button", { class: "btn", type: "button", text: STATUS_NEXT_LABEL(it), onclick: () => patch(it.id, { status: "done" }) })
        : el("button", { class: "btn", type: "button", text: "Undo", onclick: () => patch(it.id, { status: "inbox" }) }),
      el("button", { class: "btn star", type: "button", "aria-pressed": String(!!it.starred), "aria-label": "Star", text: it.starred ? "★" : "☆", onclick: () => patch(it.id, { starred: !it.starred }) }),
      el("button", { class: "btn", type: "button", text: isEditing ? "Close" : "Edit", onclick: () => toggleEdit(it) }),
      confirmDel === it.id
        ? el("button", { class: "btn del", type: "button", text: "Tap again to delete", onclick: () => { confirmDel = null; remove(it.id); } })
        : el("button", { class: "btn del", type: "button", text: "Delete", onclick: () => { confirmDel = it.id; render(); setTimeout(() => { if (confirmDel === it.id) { confirmDel = null; render(); } }, 3000); } }),
    );
    const card = el("article", { class: "item" + (it.status === "done" ? " done" : ""), "data-id": it.id },
      el("div", { class: "mono-badge", style: badgeStyle(it.type), "aria-hidden": "true", text: src.mono }),
      titleNode, meta,
      it.note && !isEditing ? el("p", { class: "note", text: it.note }) : null,
      actions,
      isEditing ? renderEdit(it) : null,
    );
    if (view.focus === it.id) { card.classList.add("flash"); }
    return card;
  }

  function renderEdit(it) {
    const bind = (k) => (e) => { draft[k] = e.target.value; };
    const typeSel = el("select", { id: "ed-type-" + it.id, onchange: bind("type") },
      Object.entries(TYPE_LABEL).map(([v, l]) => el("option", { value: v, selected: draft.type === v, text: l })));
    const ta = el("textarea", { id: "ed-note-" + it.id, rows: "3", oninput: bind("note") }); ta.value = draft.note;
    const ti = el("input", { id: "ed-title-" + it.id, type: "text", oninput: bind("title") }); ti.value = draft.title;
    const du = el("input", { id: "ed-due-" + it.id, type: "date", oninput: bind("due") }); du.value = draft.due;
    return el("div", { class: "edit" },
      el("label", {}, "Title", ti),
      el("label", {}, "Note", ta),
      el("div", { class: "two" }, el("label", {}, "Type", typeSel), el("label", {}, "Apply / finish by", du)),
      el("div", { class: "dump-row" },
        el("button", { class: "btn primary", type: "button", text: "Save changes", onclick: async () => {
          const d = draft; editingId = null; draft = null;
          await patch(it.id, { title: d.title.trim() || it.title, note: d.note.trim(), type: d.type, due: d.due || "" });
          render();
        } }),
        el("button", { class: "btn", type: "button", text: "Cancel", onclick: () => { editingId = null; draft = null; render(); } })),
    );
  }

  function toggleEdit(it) {
    if (editingId === it.id) { editingId = null; draft = null; }
    else { editingId = it.id; draft = { title: it.title || "", note: it.note || "", type: it.type, due: it.due || "" }; }
    render();
    if (editingId) document.getElementById("ed-title-" + it.id)?.focus();
  }

  function render() {
    renderStats();
    const list = $("list");
    if (!ready) return;
    const rows = filtered();
    list.replaceChildren();
    if (!rows.length) {
      const msg = !links.length
        ? ["Your stash is empty", "Paste a job link, a course, an Instagram or LinkedIn post, or a whole WhatsApp message above. Links get sorted into Jobs, Learning and Posts automatically."]
        : view.status === "inbox" && !view.q && view.kind === "all"
          ? ["Inbox zero", "Everything is sorted. Check Queued for what you planned to read or apply to."]
          : ["Nothing here", "No saved items match this filter."];
      list.append(el("div", { class: "empty" }, el("h2", { text: msg[0] }), el("p", { text: msg[1] })));
    } else rows.forEach(it => list.append(renderItem(it)));
    if (view.focus) {
      const n = list.querySelector(`[data-id="${CSS.escape(view.focus)}"]`);
      if (n) n.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
      view.focus = null;
    }
  }

  // ---------- triage ----------
  function openTriage() {
    triageQueue = links.filter(l => l.status === "inbox").sort((a, b) => a.createdAt - b.createdAt).map(l => l.id);
    triageIdx = 0; if (!triageQueue.length) return toast("Inbox is empty");
    $("triage").hidden = false; showTriage();
  }
  function showTriage() {
    while (triageIdx < triageQueue.length && !links.find(l => l.id === triageQueue[triageIdx] && l.status === "inbox")) triageIdx++;
    if (triageIdx >= triageQueue.length) { closeTriage(); toast("Review finished. Nice."); return; }
    const it = links.find(l => l.id === triageQueue[triageIdx]);
    $("trCount").textContent = `${triageIdx + 1} of ${triageQueue.length} · saved ${ago(it.createdAt)}`;
    $("trTitle").textContent = it.title || it.url;
    $("trMeta").replaceChildren(el("span", { class: "chip t-" + it.type, text: TYPE_LABEL[it.type] }), it.url ? el("span", { class: "domain", style: "font-family:var(--f-mono)", text: host(it.url) }) : null);
    $("trNote").textContent = it.note || ""; $("trNote").hidden = !it.note;
    $("trOpen").hidden = !it.url; if (it.url) $("trOpen").href = it.url;
    $("trDone").textContent = STATUS_NEXT_LABEL(it);
    $("trLater").focus();
  }
  const closeTriage = () => { $("triage").hidden = true; };
  const triageAct = async (fn) => { const id = triageQueue[triageIdx]; triageIdx++; showTriage(); if (fn) await fn(id); };
  $("triageBtn").onclick = openTriage;
  $("trLater").onclick = () => triageAct(id => patch(id, { status: "later" }));
  $("trDone").onclick = () => triageAct(id => patch(id, { status: "done" }));
  $("trSkip").onclick = () => triageAct(null);
  $("trDel").onclick = () => triageAct(id => remove(id));
  $("trClose").onclick = closeTriage;
  $("triage").addEventListener("click", (e) => { if (e.target === $("triage")) closeTriage(); });

  // ---------- inputs ----------
  function setStatusTab(s) {
    view.status = s;
    document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === s)));
    render();
  }
  $("tabs").addEventListener("click", (e) => { const b = e.target.closest("button"); if (b) setStatusTab(b.dataset.s); });
  $("strip").addEventListener("click", (e) => { const b = e.target.closest(".stat"); if (b) setStatusTab(view.status === b.dataset.f ? "inbox" : b.dataset.f); });
  $("kindSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return; view.kind = b.dataset.k;
    $("kindSeg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); render();
  });
  $("typeSeg").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return; addType = b.dataset.t;
    $("typeSeg").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); updateHint();
  });
  let qTimer; $("q").addEventListener("input", (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { view.q = e.target.value; render(); }, 120); });

  function updateHint() {
    const items = parseDump($("dump").value, addType === "auto" ? null : addType);
    const urls = items.filter(i => i.url).length;
    $("dumpHint").textContent = !items.length ? "Ctrl/⌘ + Enter to save"
      : urls ? `${urls} ${urls === 1 ? "link" : "links"} found` + (urls === 1 ? ` · looks like ${TYPE_LABEL[items[0].type]}` : "")
      : "Saves as a note";
  }
  $("dump").addEventListener("input", updateHint);
  async function save() {
    const items = parseDump($("dump").value, addType === "auto" ? null : addType);
    if (!items.length) { toast("Paste a link or type a note first"); return; }
    $("saveBtn").disabled = true;
    const ok = await addItems(items);
    $("saveBtn").disabled = false;
    if (ok) { $("dump").value = ""; updateHint(); }
  }
  $("saveBtn").onclick = save;
  $("dump").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); save(); } });
  document.addEventListener("paste", (e) => {
    const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    const text = e.clipboardData?.getData("text") || ""; if (!text.match(URL_RE)) return;
    e.preventDefault(); addItems(parseDump(text, null));
  });
  document.addEventListener("keydown", (e) => {
    if (!$("triage").hidden && e.key === "Escape") closeTriage();
  });

  // ---------- boot ----------
  function showGate(title, body) {
    ready = false;
    $("list").replaceChildren(el("div", { class: "empty" }, el("h2", { text: title }), el("p", { text: body })));
  }
  (async () => {
    renderStats();
    const api = window.claude;
    if (!api || !api.use) { showGate("Open this on claude.ai", "Link Stash keeps your links in your claude.ai account. Open the shared link while signed in."); return; }
    const [dbNs, user] = await Promise.all([api.use("db"), api.use("user")]);
    if (!dbNs) { showGate("Sign in to see your stash", "Your links are stored in your claude.ai account. Sign in and reopen this page."); return; }
    if (user && !(await user.isOwner())) { showGate("This stash is private", "Only the owner can see and add links here."); return; }
    db = dbNs;
    db.collection("links").onSnapshot((snap) => {
      links = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .map(l => ({ ...l, type: TYPE_LABEL[l.type] ? l.type : "other", status: l.status || "inbox", createdAt: l.createdAt || 0 }));
      ready = true;
      if (editingId) { pendingRender = true; renderStats(); return; }
      render();
    }, () => showGate("Your stash went offline", "Reload the page to reconnect."));
  })();
})();
</script>
